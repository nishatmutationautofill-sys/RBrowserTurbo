plugins { id 'com.android.application' }

android {
    namespace 'com.example.banglalitebrowser'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.banglalitebrowser'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    buildTypes {
        release {
            // R8 shrinks code and resources: smaller APK, faster install and start-up.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the APK installs for testing.
            // Before publishing anywhere, replace this with your own release keystore.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
